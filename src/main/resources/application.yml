spring:
  application:
    name: gestion-pro-backend
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USER:gestion}
    password: ${DB_PASSWORD:gestion}
  jpa:
    # Flyway es la única fuente del esquema; Hibernate no lo toca.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Santiago
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    # Clave HMAC de al menos 32 caracteres. Cambiar fuera del entorno local.
    secreto: ${JWT_SECRETO:clave-local-de-desarrollo-gestion-pro-2026}
    horas-validez: 8
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
